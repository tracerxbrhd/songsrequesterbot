name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install CLI
        run: npm install --no-audit --no-fund
      - name: Check JavaScript
        run: npm run check
      - name: Unit tests
        run: npm test
