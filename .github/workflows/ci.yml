name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r cloud_function/requirements.txt
      - name: Python syntax
        run: python -m compileall -q cloud_function tools tests
      - name: Unit tests
        env:
          PYTHONPATH: cloud_function
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify old cloud platform is absent
        run: |
          test ! -d tgcloud
          test ! -f tgcloud.jsonc
          ! grep -R -nE 'TGCLOUD_TOKEN|@tgcloud/cli|Jamendo' cloud_function || exit 1
