name: Deploy Yandex Cloud Function

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate_webhook:
        description: 'Switch Telegram webhook after successful live probe (requires Lockbox payloadViewer)'
        type: boolean
        required: true
        default: false
      allow_metadata_only:
        description: 'Permit switch even if MP3 is not accessible'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: songsrequesterbot-yc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      ${{ vars.YC_FOLDER_ID != '' &&
          vars.YC_FUNCTION_ID != '' &&
          vars.YC_RUNTIME_SA_ID != '' &&
          vars.YC_LOCKBOX_SECRET_ID != '' &&
          vars.YC_LOCKBOX_VERSION_ID != '' &&
          vars.OWNER_TELEGRAM_ID != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local tests
        run: python -m pip install -r cloud_function/requirements.txt
      - name: Test before deployment
        env:
          PYTHONPATH: cloud_function
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require deploy service-account key
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          if [ -z "$YC_SA_KEY_JSON" ]; then
            echo "::error::Missing YC_SA_KEY_JSON in repository Actions secrets"
            exit 1
          fi
          umask 077
          printf '%s' "$YC_SA_KEY_JSON" > "$RUNNER_TEMP/yc-sa.json"
          python -m json.tool "$RUNNER_TEMP/yc-sa.json" > /dev/null
      - name: Install official Yandex Cloud CLI
        run: |
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Configure YC CLI
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          yc config profile create github-actions
          yc config set service-account-key "$RUNNER_TEMP/yc-sa.json"
          yc config set folder-id "$YC_FOLDER_ID"
      - name: Deploy version with Lockbox-managed runtime secrets
        env:
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
          YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
          YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_VERSION_ID: ${{ vars.YC_LOCKBOX_VERSION_ID }}
          OWNER_TELEGRAM_ID: ${{ vars.OWNER_TELEGRAM_ID }}
        run: |
          test "$OWNER_TELEGRAM_ID" -gt 0
          yc serverless function version create \
            --function-id "$YC_FUNCTION_ID" \
            --runtime python312 \
            --entrypoint index.handler \
            --memory 512m \
            --tmpfs-size 128m \
            --execution-timeout 60s \
            --source-path ./cloud_function \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "OWNER_TELEGRAM_ID=$OWNER_TELEGRAM_ID" \
            --secret "environment-variable=TELEGRAM_BOT_TOKEN,id=$YC_LOCKBOX_SECRET_ID,version-id=$YC_LOCKBOX_VERSION_ID,key=TELEGRAM_BOT_TOKEN" \
            --secret "environment-variable=YANDEX_OAUTH_TOKEN,id=$YC_LOCKBOX_SECRET_ID,version-id=$YC_LOCKBOX_VERSION_ID,key=YANDEX_OAUTH_TOKEN" \
            --secret "environment-variable=TELEGRAM_WEBHOOK_SECRET,id=$YC_LOCKBOX_SECRET_ID,version-id=$YC_LOCKBOX_VERSION_ID,key=TELEGRAM_WEBHOOK_SECRET"
      - name: Remove deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-sa.json"
      - name: Install cutover requirements
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_webhook }}
        run: python -m pip install requests==2.32.5
      - name: Preflight and activate Telegram webhook
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_webhook }}
        env:
          YC_FUNCTION_ID: ${{ vars.YC_FUNCTION_ID }}
          YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_VERSION_ID: ${{ vars.YC_LOCKBOX_VERSION_ID }}
          ALLOW_METADATA_ONLY: ${{ inputs.allow_metadata_only }}
        run: |
          args=()
          if [ "$ALLOW_METADATA_ONLY" = "true" ]; then args+=(--allow-metadata-only); fi
          python tools/activate_webhook.py \
            --function-id "$YC_FUNCTION_ID" \
            --secret-id "$YC_LOCKBOX_SECRET_ID" \
            --version-id "$YC_LOCKBOX_VERSION_ID" "${args[@]}"
